tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: Returns a list of all contacts
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      example: 1
  - in: query
    name: perPage
    schema:
      type: integer
      example: 10
  - in: query
    name: sortBy
    schema:
      type: string
      description: List of contacts sort by
      enum: ['name', 'isFavorite', 'contactType']
      example: name
  - in: query
    name: sortOrder
    schema:
      type: string
      description: List of contacts sort order
      enum: ['asc', 'desc']
      example: asc

  - in: query
    name: isFavorite
    schema:
      type: boolean
      description: List of contacts filter by favorite
      example: true
responses:
  '200':
    description: Successfully found contacts
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: array
              items:
                $ref: D:\projects\Pasha Kutuzov\node-js\nodejs-hw-mongodb\swagger\components\paths\contacts\{id}\components\schemas\contact.yaml
                page:
                  type: integer
                perPage:
                  type: integer
                totalItems:
                  type: integer
                totalPages:
                  type: integer
                hasPreviousPage:
                  type: boolean
                hasNextPage:
                  type: boolean
          example:
            status: 200
            message: Successfully found contacts!
            data:
              data:
                - _id: 97dfvsd78vdf8s5
                  name: Jone Doe
                  phoneNumber: '+38099999999'
                  email: mail@mail.com
                  isFavorite: false
                  contactType: personal
                  userId: 8s7d6fsd765dcs8d7vsdvs
                  photo: https://res.cloudinary.com/dm6jfl64t/image/upload/v1750360223/yw62b0bnamsjnh4l59vg.png
                  createdAt: 2025-06-07T21:24:43.983+00:00
                  updatedAt: 2025-11-23T12:04:13.983+00:00
              page: 1
              perPage: 10
              totalItems: 1
              totalPages: 1
              hasPreviousPage: false
              hasNextPage: false
  '401':
    $ref: D:\projects\Pasha Kutuzov\node-js\nodejs-hw-mongodb\swagger\components\paths\contacts\{id}\responses\401.yaml
  '404':
    $ref: D:\projects\Pasha Kutuzov\node-js\nodejs-hw-mongodb\swagger\components\paths\contacts\{id}\responses\404.yaml
  '500':
    $ref: D:\projects\Pasha Kutuzov\node-js\nodejs-hw-mongodb\swagger\components\paths\contacts\{id}\responses\500.yaml
