tags:
  - Contacts
summary: Create contact
operationId: createContact
description: Create contacts
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
            description: Contact name
            example: John Doe
          phoneNumber:
            type: string
            description: Contact phone phone number
            example: '+380000000000'
          email:
            type: string
            description: Contact email
            example: mail@mail.com
          isFavorite:
            type: boolean
            description: Contact is favorite
            example: true
            default: false
          contactType:
            type: string
            description: Type of contact
            enum: ['work', 'home', 'personal']
            default: personal
          photo:
            type: string
            format: binary
            description: Photo of contact
responses:
  '201':
    description: Successfully created a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully create contact!
            data:
              $ref: D:\projects\Pasha Kutuzov\node-js\nodejs-hw-mongodb\swagger\components\paths\contacts\{id}\components\schemas\contact.yaml
  '401':
    $ref: D:\projects\Pasha Kutuzov\node-js\nodejs-hw-mongodb\swagger\components\paths\contacts\{id}\responses\401.yaml

  '500':
    $ref: D:\projects\Pasha Kutuzov\node-js\nodejs-hw-mongodb\swagger\components\paths\contacts\{id}\responses\500.yaml
